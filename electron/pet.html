<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shatta</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #f5efe9;
      }
      #card {
        position: fixed;
        right: 28px;
        bottom: 28px;
        max-width: 260px;
        padding: 14px 16px;
        border-radius: 16px;
        background: #241a1a;
        border: 2px solid #e0342f;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        font-size: 13px;
        line-height: 1.45;
        -webkit-app-region: drag;
      }
      strong {
        color: #ff6b5e;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <strong>Shatta is offline.</strong>
      <p>I can't reach the app right now. Start the dev server or reload from the tray menu.</p>
    </div>
    <script>
      window.shatta?.setInteractive?.(true);
    </script>
  </body>
</html>
